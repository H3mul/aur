name: Rebuild all

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to AUR (dirs with .aur-ci-disable are still skipped)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.ls.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: ls
        run: echo "packages=$(ls -d */PKGBUILD | cut -d/ -f1 | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      packages: ${{ needs.list.outputs.packages }}
      publish: ${{ inputs.publish }}
