name: Rebuild all

on:
  schedule:
    - cron: '0 4 * * *' # daily; publishing is a no-op when AUR is in sync
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to AUR (dirs with .aur-ci-disable are skipped entirely)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.ls.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: ls
        run: echo "packages=$(ls -d */PKGBUILD | cut -d/ -f1 | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      packages: ${{ needs.list.outputs.packages }}
      publish: ${{ inputs.publish || github.event_name == 'schedule' }}
