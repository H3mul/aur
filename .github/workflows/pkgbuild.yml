name: PKGBUILD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Top-level dirs touched by this push/PR that still hold a PKGBUILD; all of them if the build script changed
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # BASE is gone after a force push (or all zeros on a new branch): treat everything as changed
          changed=$(git cat-file -e "$BASE^{commit}" 2>/dev/null && git diff --name-only "$BASE" HEAD || echo .github/workflows/build.yml)
          grep -qx '.github/workflows/build.yml' <<<"$changed" && changed=$(printf '%s\n' */PKGBUILD)
          pkgs=$(cut -sd/ -f1 <<<"$changed" | sort -u | while read -r d; do
            [ -f "$d/PKGBUILD" ] && echo "$d"
          done | jq -Rsc 'split("\n")[:-1]')
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

  build:
    needs: changed
    if: needs.changed.outputs.packages != '[]'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      packages: ${{ needs.changed.outputs.packages }}
      publish: ${{ github.event_name == 'push' }}
