name: Renovate

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # PAT/App token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger the PKGBUILD workflow
      - uses: renovatebot/github-action@v46.3.3
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
